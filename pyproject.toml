[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-reasoning"
version = "0.1.0"
description = "A framework for analyzing consequential states in RL using counterfactual reasoning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "RL Research Team", email = "research@example.com" },
]
keywords = [
    "reinforcement-learning",
    "counterfactual-reasoning",
    "state-analysis",
    "policy-analysis",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.scripts]
cce-run = "training.run:main"
cce-study = "analysis.studies.run:main"

[project.optional-dependencies]
research = [
    "jax==0.9.1", "jaxlib==0.9.1", "flax==0.10.4", "optax==0.2.5",
    "chex==0.1.91", "matplotlib==3.10.7", "tqdm==4.67.1", "gymnasium>=1.0",
    "rliable>=1.2.0", "Pillow>=10.0", "imageio[ffmpeg]>=2.31",
]
legacy = ["gymnasium>=0.27.0", "stable-baselines3>=1.6.0", "matplotlib>=3.5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/manchado53/counterfactual-reasoning"
Repository = "https://github.com/manchado53/counterfactual-reasoning.git"
Issues = "https://github.com/manchado53/counterfactual-reasoning/issues"

[tool.setuptools]
package-dir = { "counterfactual_rl" = "src/counterfactual_rl", "training" = "training", "analysis" = "analysis" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["counterfactual_rl*", "training*", "analysis*"]
namespaces = false

[tool.setuptools.package-data]
"training.learners.doorkey" = ["source_recipe.json"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
