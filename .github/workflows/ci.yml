name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "research/**"
      - "experiment/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[research,dev]'
      - name: Validate recipes
        run: python -m training.catalog --root .
      - name: Run tests
        env:
          PYTHONPATH: .:src
        run: pytest -q
